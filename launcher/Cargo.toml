[package]
name = "grawbox-launcher"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "GRAWBox"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = { version = "0.18", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
