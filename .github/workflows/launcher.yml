# Builds and tests the launcher. A tag v* also publishes it as a release asset.
name: launcher

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["launcher/**", "input/keys.h", ".github/workflows/launcher.yml"]
  pull_request:
    paths: ["launcher/**", "input/keys.h", ".github/workflows/launcher.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            launcher/target
          key: launcher-${{ hashFiles('launcher/Cargo.lock') }}
      - name: Font
        shell: pwsh
        run: ./launcher/fetch_fonts.ps1
      - name: Test
        working-directory: launcher
        run: cargo test --release --locked
      - name: Build
        working-directory: launcher
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          New-Item -ItemType Directory dist/GRAWBox | Out-Null
          Copy-Item launcher/target/release/GRAWBox.exe, LICENSE, README.md dist/GRAWBox/
          Copy-Item launcher/fonts/OFL.txt dist/GRAWBox/OFL-Rajdhani.txt
          Compress-Archive dist/GRAWBox "dist/GRAWBox-$name-windows-x64.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: GRAWBox-windows-x64
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: GRAWBox-windows-x64
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" GRAWBox-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
